services:
  postgres:
    image: postgres:16
    container_name: taskflow-postgres
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - taskflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    ports:
      - "8082:8978"
    depends_on:
      postgres:
        condition: service_healthy # Wait for Postgres to be fully ready
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: taskflow-
    volumes:
      - keycloak-data:/opt/keycloak/data
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"   # Maps Keycloak to http://localhost:8081
    command: start-dev

volumes:
  taskflow-data:
  cloudbeaver_data:  # Added missing volume definition
  keycloak-data: